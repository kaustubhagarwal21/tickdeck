# Continuous integration: every push and pull request runs the same checks as
# a local run, in this order: types, lint, unit tests, production build, then
# the Playwright end-to-end tests against that build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests (Jest)
        run: npm test -- --ci

      - name: Production build
        run: npm run build

      # Locally the tests drive Microsoft Edge; on CI (where CI=true)
      # playwright.config.ts uses Playwright's own Chromium instead.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Keep the Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-artifacts/
          retention-days: 7
